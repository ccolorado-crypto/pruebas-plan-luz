name: Actualizar Dashboard RNDC (ETL)

on:
  push:
    paths:
      - 'data/data.ods' # Se ejecuta solo cuando subes un nuevo archivo de datos
  workflow_dispatch: # Permite ejecutarlo con un botón manual

jobs:
  procesar-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar ETL (Generador Dashboard)
        run: python generador_dashboard.py

      - name: Subir cambios (JSONs actualizados) al repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/*.json
          git add data/historial.json
          git commit -m "Automatización: Datos ETL procesados y JSONs actualizados" || echo "No hay cambios para subir"
          git push
