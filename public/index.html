<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Plan Luz - Ártimo</title>
    <style>
        /* Variables de Marca Ártimo (Ajustar códigos HEX según el manual .md) */
        :root {
            --color-primario: #E3000F; /* Reemplazar por el Rojo Ártimo exacto */
            --color-secundario: #000000; /* Negro corporativo */
            --color-fondo: #F8F9FA;
            --fuente-principal: 'Rubik', Arial, sans-serif;
        }

        body {
            font-family: var(--fuente-principal);
            background-color: var(--color-fondo);
            color: var(--color-secundario);
            margin: 0;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--color-primario);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .logo {
            max-height: 65px;
        }

        .filtros {
            margin-bottom: 20px;
        }

        button {
            background-color: var(--color-secundario);
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            margin-right: 8px;
            border-radius: 5px;
            font-family: var(--fuente-principal);
            font-weight: 500;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #333333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #EEEEEE;
        }

        th {
            background-color: var(--color-primario);
            color: white;
            font-weight: 500;
        }

        .horas-destacadas {
            color: var(--color-primario);
            font-weight: bold;
        }
    </style>
    <!-- Importar tipografía Rubik -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="header">
        <div>
            <h1>Panorama Operativo - Flotas Eléctricas</h1>
            <p>Datos actualizados automáticamente vía ETL</p>
        </div>
        <!-- Asegúrate de que artimo_logo.jpg esté en la misma carpeta public/ -->
        <img src="artimo_logo.jpg" alt="Logo Ártimo" class="logo">
    </div>

    <div class="filtros">
        <button onclick="cargarDatos('todos')">Vista General</button>
        <button onclick="cargarDatos('activos')">Equipos con Operación Reciente</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Identificación</th>
                <th>Cliente</th>
                <th>Canal</th>
                <th>Horas Recientes</th>
                <th>Horómetro Total</th>
                <th>Última Conexión</th>
            </tr>
        </thead>
        <tbody id="tabla-body">
            <tr><td colspan="6">Cargando datos desde la nube...</td></tr>
        </tbody>
    </table>

    <script>
        let datosGlobales = [];

        // Función para consultar el JSON de forma asíncrona
        async function obtenerDatos() {
            try {
                const respuesta = await fetch('consolidado_general.json');
                datosGlobales = await respuesta.json();
                cargarDatos('todos');
            } catch (error) {
                console.error("Error al cargar los datos:", error);
                document.getElementById('tabla-body').innerHTML = '<tr><td colspan="6">No se pudo cargar la información. Verifica que el archivo consolidado_general.json se haya generado correctamente.</td></tr>';
            }
        }

        // Función para renderizar la tabla aplicando filtros
        function cargarDatos(filtro) {
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = '';

            let datosParaMostrar = datosGlobales;

            // Filtro interactivo sin recargar la página
            if (filtro === 'activos') {
                datosParaMostrar = datosGlobales.filter(d => d.horas_recientes > 0);
            }

            datosParaMostrar.forEach(dato => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td><strong>${dato.identificacion}</strong></td>
                    <td>${dato.cliente}</td>
                    <td>${dato.canal}</td>
                    <td class="horas-destacadas">${dato.horas_recientes.toFixed(2)} h</td>
                    <td>${dato.horometro_total.toFixed(2)}</td>
                    <td>${dato.ultima_conexion}</td>
                `;
                tbody.appendChild(fila);
            });
        }

        // Ejecutar la petición al cargar el DOM
        window.onload = obtenerDatos;
    </script>
</body>
</html>
