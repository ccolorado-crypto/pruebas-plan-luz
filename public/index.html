<script>
        let rawData = [];
        let trendDataGlobal = {}; // Aquí guardaremos la bitácora
        
        let currentFilters = { dealer: 'TODOS', cliente: 'TODOS', modelo: null, estado: null, tecnologia: null, gravedad: null };
        let searchTerm = '';
        let isHeatmapMode = false;
        let currentPage = 1;
        const rowsPerPage = 20;

        function parseCoord(val) {
            if (!val || String(val).toLowerCase() === 'nan' || String(val).trim() === '') return null;
            let num = parseFloat(String(val).replace(',', '.'));
            if (isNaN(num) || num === 0) return null;
            return num;
        }

        function parseDateCustom(dateStr) {
            if (!dateStr || String(dateStr).toLowerCase() === 'nan' || dateStr === 'NaT') return null;
            let dStr = String(dateStr).trim().split(' ')[0];
            if (dStr.includes('/')) {
                let parts = dStr.split('/');
                if(parts.length < 3) return null;
                let y = parseInt(parts[2]);
                if (y < 100) y += 2000;
                return new Date(y, parseInt(parts[1]) - 1, parseInt(parts[0]));
            }
            if (dStr.includes('-')) {
                let parts = dStr.split('-');
                if(parts.length < 3) return null;
                return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            }
            return null;
        }

        async function cargarDatosDinamicos() {
            try {
                // 1. CARGAR DATOS
                const response = await fetch('consolidado_general.json');
                const jsonData = await response.json();
                
                // 2. CARGAR TENDENCIAS
                try {
                    const resTrend = await fetch('tendencia.json');
                    trendDataGlobal = await resTrend.json();
                } catch(e) { console.log("Aún no hay tendencias"); }
                
                let maxDate = new Date(0);
                jsonData.forEach(item => {
                    let d = parseDateCustom(item.ultima_conexion);
                    if (d && d > maxDate) maxDate = d;
                });
                
                let hoyReal = new Date();
                let hoy = maxDate > hoyReal ? maxDate : hoyReal;
                hoy.setHours(0,0,0,0);
                
                rawData = jsonData.map(item => {
                    let fUltima = parseDateCustom(item.ultima_conexion);
                    let diasOff = 0;
                    let estadoStr = "Operando";
                    let gravedadStr = "Conectado";
                    let planStr = "✅ Monitoreo continuo. Equipo estable.";

                    if (fUltima) {
                        fUltima.setHours(0,0,0,0);
                        let diffTime = hoy - fUltima;
                        diasOff = Math.floor(diffTime / (1000 * 3600 * 24));
                        if (diasOff < 0) diasOff = 0;
                        
                        if (diasOff > 0) {
                            estadoStr = "Fuera de cobertura";
                            if (diasOff <= 3) { gravedadStr = "1 a 3 días"; planStr = "🔍 Validar intermitencia de red."; }
                            else if (diasOff <= 7) { gravedadStr = "4 a 7 días"; planStr = "🛠️ Validar dispositivo y señal GPRS."; }
                            else { gravedadStr = "Más de 7 días"; planStr = "🚨 Visita técnica urgente."; }
                        }
                    } else {
                        estadoStr = "Fuera de cobertura";
                        gravedadStr = "Sin registro previo";
                        planStr = "Verificar conexión inicial.";
                    }

                    let horo = parseFloat(item.horometro_total) || 0;
                    let horoFinal = horo > 999999 ? "Error Sensor" : Number(horo).toLocaleString('es-CO', {minimumFractionDigits: 1, maximumFractionDigits: 1});

                    return {
                        dealer: item.dealer || item.canal || "SIN DEALER",
                        generador: item.generador || item.identificacion || "SIN ID",
                        cliente: item.cliente || "SIN CLIENTE",
                        tecnologia: item.tecnologia || item.Type || "Desconocida",
                        modelo: item.modelo || item.Script || "Desconocido",
                        fecha: item.ultima_conexion ? String(item.ultima_conexion).split(' ')[0] : "Sin registro",
                        estado: estadoStr,
                        gravedad: gravedadStr,
                        dias_offline: diasOff,
                        plan_accion: planStr,
                        lat: parseCoord(item.latitud),
                        lon: parseCoord(item.longitud),
                        horometro_visual: horoFinal
                    };
                });
                
                populateDropdowns(); 
                updateDashboard();

            } catch (error) {
                console.error("Error al cargar los datos", error);
                document.getElementById('no_data_message').style.display = 'block';
                document.getElementById('no_data_message').innerText = 'No se pudo cargar el archivo JSON.';
            }
        }

        window.addEventListener('DOMContentLoaded', () => { cargarDatosDinamicos(); });

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); updateDashboard(); }
        
        function getLayoutBase() {
            const isDark = document.body.classList.contains('dark-mode');
            const fontColor = isDark ? '#E0E0E0' : '#1A1A1A';
            return { font: { family: 'Open Sans, Arial, sans-serif', color: fontColor }, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', margin: { t: 40, b: 30, l: 40, r: 20 }, height: 280 };
        }
        
        function truncateLabel(str, maxLen = 22) { if (!str) return ''; return str.length > maxLen ? str.substring(0, maxLen - 2) + '..' : str; }

        function populateDropdowns() {
            const dealerSelect = document.getElementById('dealer_select');
            const clientSelect = document.getElementById('client_select');
            
            dealerSelect.innerHTML = '<option value="TODOS">-- TODOS LOS DEALERS --</option>';
            clientSelect.innerHTML = '<option value="TODOS">-- TODOS LOS CLIENTES --</option>';

            const uniqueDealers = [...new Set(rawData.map(d => d.dealer))].sort();
            uniqueDealers.forEach(d => {
                const opt = document.createElement('option'); opt.value = opt.textContent = d;
                if(currentFilters.dealer === d) opt.selected = true; dealerSelect.appendChild(opt);
            });

            let clientsData = rawData;
            if(currentFilters.dealer !== 'TODOS') { clientsData = rawData.filter(d => d.dealer === currentFilters.dealer); }
            const uniqueClients = [...new Set(clientsData.map(d => d.cliente))].sort();
            uniqueClients.forEach(c => {
                const opt = document.createElement('option'); opt.value = opt.textContent = c;
                if(currentFilters.cliente === c) opt.selected = true; clientSelect.appendChild(opt);
            });
            
            if (uniqueDealers.length <= 1) dealerSelect.style.display = 'none';
        }

        function filterByDropdown(key, val) { currentFilters[key] = val; if(key === 'dealer') currentFilters.cliente = 'TODOS'; populateDropdowns(); updateDashboard(); }
        function applyQuickWins() { currentFilters = { dealer: 'TODOS', cliente: 'TODOS', modelo: null, estado: null, tecnologia: null, gravedad: '1 a 3 días' }; populateDropdowns(); document.getElementById('table_search').value = ''; searchTerm = ''; updateDashboard(); document.getElementById('table_title').scrollIntoView({ behavior: 'smooth' }); }
        function applyDangerSLA() { currentFilters = { dealer: 'TODOS', cliente: 'TODOS', modelo: null, estado: null, tecnologia: null, gravedad: 'Más de 7 días' }; populateDropdowns(); document.getElementById('table_search').value = ''; searchTerm = ''; updateDashboard(); document.getElementById('table_title').scrollIntoView({ behavior: 'smooth' }); }
        function clearFilter(key) { if(key === 'dealer' || key === 'cliente') currentFilters[key] = 'TODOS'; else currentFilters[key] = null; populateDropdowns(); updateDashboard(); }
        function clearAllFilters() { currentFilters = { dealer: 'TODOS', cliente: 'TODOS', modelo: null, estado: null, tecnologia: null, gravedad: null }; document.getElementById('table_search').value = ''; searchTerm = ''; populateDropdowns(); updateDashboard(); }
        function onSearchTable(val) { searchTerm = val.toLowerCase().trim(); currentPage = 1; renderTableOnly(); }
        function toggleHeatmap() { isHeatmapMode = !isHeatmapMode; updateDashboard(); }
        function closeModal() { document.getElementById('info_modal').style.display = 'none'; }
        
        window.onclick = function(event) {
            let modal = document.getElementById('info_modal');
            if (event.target == modal) { modal.style.display = 'none'; }
        }

        function getFilteredData() {
            return rawData.filter(d => 
                (currentFilters.dealer === 'TODOS' || d.dealer === currentFilters.dealer) &&
                (currentFilters.cliente === 'TODOS' || d.cliente === currentFilters.cliente) &&
                (!currentFilters.estado || d.estado === currentFilters.estado) &&
                (!currentFilters.tecnologia || d.tecnologia === currentFilters.tecnologia) &&
                (!currentFilters.modelo || d.modelo === currentFilters.modelo) &&
                (!currentFilters.gravedad || d.gravedad === currentFilters.gravedad)
            );
        }

        function updateDashboard() {
            currentPage = 1;
            const filteredData = getFilteredData();
            const total = filteredData.length;
            const online = filteredData.filter(d => d.estado === 'Operando').length;
            const offline = total - online;
            const lostDays = filteredData.reduce((acc, curr) => acc + (curr.dias_offline > 0 ? curr.dias_offline : 0), 0);

            const pctOnline = total > 0 ? ((online/total)*100).toFixed(1) : 0;
            const pctOffline = total > 0 ? Math.round((offline/total)*100) : 0;
            const mttr = offline > 0 ? Math.round(lostDays / offline) : 0;

            document.getElementById('kpi_total').textContent = total;
            document.getElementById('kpi_online').textContent = Math.round(pctOnline) + "% (" + online + ")";
            document.getElementById('kpi_offline').textContent = pctOffline + "% (" + offline + ")";
            document.getElementById('kpi_mttr').textContent = mttr + " días";
            document.getElementById('kpi_lost_days').textContent = lostDays.toLocaleString();

            renderActiveFilterTags(); 
            renderTrendChart(); // Ahora se llama desde aquí
            renderMapChart(filteredData); 
            renderDonaChart(filteredData); 
            renderTechChart(filteredData);
            renderGravityChart(filteredData); 
            renderTopDealersChart(filteredData); 
            renderTopClientsChart(filteredData);
            renderTopModelsChart(filteredData); 
            
            renderTableOnly(filteredData);
        }

        function renderActiveFilterTags() {
            const container = document.getElementById('active_filters'); container.innerHTML = ''; let has = false;
            Object.keys(currentFilters).forEach(key => {
                if(currentFilters[key] && currentFilters[key] !== 'TODOS') {
                    has = true; container.innerHTML += `<div class="tag">${key}: ${currentFilters[key]} <button onclick="clearFilter('${key}')">×</button></div>`;
                }
            });
            if(has) container.innerHTML += `<button class="btn-clear" onclick="clearAllFilters()">Limpiar Filtros</button>`;
            else container.innerHTML = `<span class="text-sub">Usa los menús superiores o haz clic en gráficas y mapa para filtrar.</span>`;
        }

        function renderTrendChart() {
            const isDeepFiltered = (currentFilters.modelo || currentFilters.tecnologia || currentFilters.gravedad || currentFilters.estado);
            const trendCard = document.querySelector('.trend-card');
            
            let clientKey = currentFilters.cliente !== 'TODOS' ? currentFilters.cliente : "GLOBAL";
            let chartData = trendDataGlobal[clientKey] || [];

            if(trendCard) {
                if(isDeepFiltered) {
                    trendCard.style.opacity = '0.4';
                    trendCard.title = "La gráfica histórica ignora filtros de estado o tecnología, solo muestra Cliente o Global.";
                } else {
                    trendCard.style.opacity = '1';
                    trendCard.title = "";
                }
            }

            if (!chartData || chartData.length === 0) {
                Plotly.purge('chart_trend');
                return;
            }

            const xLabels = chartData.map(d => d.fecha);
            const textOnline = chartData.map(d => `${d.online} operando`);
            const textOffline = chartData.map(d => `${d.offline} offline`);

            const traceOnline = { x: xLabels, y: chartData.map(d => d.online), name: 'Operando', type: 'scatter', mode: 'lines+markers', line: { color: '#10B981', width: 3, shape: 'spline' }, marker: { size: 8 }, text: textOnline, hovertemplate: '%{text}<extra></extra>' };
            const traceOffline = { x: xLabels, y: chartData.map(d => d.offline), name: 'Offline', type: 'scatter', mode: 'lines+markers', line: { color: '#BC1818', width: 3, shape: 'spline' }, marker: { size: 8 }, text: textOffline, hovertemplate: '%{text}<extra></extra>' };

            const layout = { ...getLayoutBase(), height: 320, title: { text: `<b>Evolución Histórica (${clientKey})</b>`, font: {size: 16}, x: 0.5 }, legend: { orientation: 'h', y: -0.2 }, xaxis: { showgrid: false, type: 'category' }, yaxis: { title: 'Máquinas', showgrid: true, gridcolor: document.body.classList.contains('dark-mode') ? '#333' : '#E5E7EB' } };
            Plotly.react('chart_trend', [traceOnline, traceOffline], layout, { responsive: true, displayModeBar: false });
        }

        function renderMapChart(data) {
            const validData = data.filter(d => d.lat !== null && d.lon !== null);
            const mapStyle = document.body.classList.contains('dark-mode') ? 'carto-darkmatter' : 'open-street-map';
            const layout = { ...getLayoutBase(), height: 450, title: { text: '<b>Ubicación de Equipos (Clic para buscar)</b>', font: {size: 16}, x: 0.5 }, mapbox: { style: mapStyle, center: {lat: 4.5709, lon: -74.2973}, zoom: 4.5 }, showlegend: !isHeatmapMode, legend: { orientation: 'h', y: -0.1 }, margin: { t: 50, b: 20, l: 10, r: 10 } };
            
            let traces = [];
            
            if (isHeatmapMode) {
                traces.push({
                    type: 'densitymapbox', lat: validData.map(d => d.lat), lon: validData.map(d => d.lon),
                    z: validData.map(d => d.estado === 'Operando' ? 1 : (d.dias_offline > 0 ? d.dias_offline : 5)),
                    radius: 20, colorscale: 'Hot', hoverinfo: 'skip'
                });
            } else {
                const colorMap = { 'Conectado': '#10B981', '1 a 3 días': '#F59E0B', '4 a 7 días': '#E84C22', 'Más de 7 días': '#BC1818', 'Sin registro previo': '#5A5A59' };
                const groups = [...new Set(validData.map(d => d.gravedad))];
                groups.forEach(g => {
                    const groupData = validData.filter(d => d.gravedad === g);
                    if (groupData.length > 0) {
                        traces.push({ 
                            type: 'scattermapbox', lat: groupData.map(d => d.lat), lon: groupData.map(d => d.lon), mode: 'markers', 
                            marker: { size: 10, color: colorMap[g] || '#5A5A59' }, name: g, customdata: groupData.map(d => d.generador), 
                            text: groupData.map(d => `Cliente: ${d.cliente}<br><i>Clic para detalles</i>`), hovertemplate: '<b>Generador: %{customdata}</b><br>%{text}<extra></extra>' 
                        });
                    }
                });
            }

            if (traces.length === 0) traces.push({ type: 'scattermapbox', lat: [], lon: [], mode: 'markers' });
            Plotly.react('chart_map', traces, layout, { responsive: true, displayModeBar: false });
            
            if (!isHeatmapMode) {
                const elMap = document.getElementById('chart_map');
                if (elMap && typeof elMap.removeAllListeners === 'function') elMap.removeAllListeners('plotly_click');
                if (elMap) {
                    elMap.on('plotly_click', d => { 
                        if (!d || !d.points || d.points.length === 0) return;
                        const clickedGen = d.points[0].customdata; 
                        const maquina = rawData.find(m => m.generador === clickedGen);
                        if(maquina) {
                            document.getElementById('modal_title').innerHTML = `📌 EQUIPO: <b>${maquina.generador}</b>`;
                            document.getElementById('modal_body').innerHTML = `
                                <p style="margin:8px 0;"><b>👤 Cliente:</b> ${maquina.cliente}</p>
                                <p style="margin:8px 0;"><b>⚙️ Modelo:</b> ${maquina.modelo}</p>
                                <p style="margin:8px 0;"><b>🔴 Estado:</b> ${maquina.estado} ${maquina.dias_offline > 0 ? `(${maquina.dias_offline} días offline)` : ''}</p>
                                <div style="margin-top: 15px; padding: 12px; background: rgba(188,24,24,0.08); border-left: 3px solid var(--artimo-rojo-oscuro); border-radius: 6px;">
                                    <b>🛠️ PLAN DE ACCIÓN:</b><br>${maquina.plan_accion}
                                </div>`;
                            document.getElementById('info_modal').style.display = 'flex';
                            document.getElementById('table_search').value = clickedGen; 
                            onSearchTable(clickedGen); 
                        }
                    });
                }
            }
        }

        function renderDonaChart(data) {
            const op = data.filter(d => d.estado === 'Operando').length; const off = data.filter(d => d.estado === 'Fuera de cobertura').length;
            const layout = { ...getLayoutBase(), title: { text: '<b>Estado General</b>', font: {size: 15}, x: 0.5 }, legend: { orientation: 'h', y: -0.1 } };
            Plotly.react('chart_dona', [{ values: [op, off], labels: ['Operando', 'Fuera de cobertura'], type: 'pie', hole: 0.5, marker: { colors: ['#10B981', '#BC1818'] }, textinfo: 'value+percent' }], layout, { responsive: true, displayModeBar: false });
            
            const elDona = document.getElementById('chart_dona');
            if (elDona && typeof elDona.removeAllListeners === 'function') { elDona.removeAllListeners('plotly_click'); }
            if (elDona) { elDona.on('plotly_click', d => { currentFilters.estado = (currentFilters.estado === d.points[0].label) ? null : d.points[0].label; updateDashboard(); }); }
        }

        function renderTechChart(data) {
            const map = {}; data.forEach(d => { if(!map[d.tecnologia]) map[d.tecnologia] = { op: 0, off: 0 }; d.estado === 'Operando' ? map[d.tecnologia].op++ : map[d.tecnologia].off++; });
            const x = Object.keys(map).sort();
            const layout = { ...getLayoutBase(), title: { text: '<b>Estado por Tecnología</b>', font: {size: 15}, x: 0.5 }, barmode: 'group', legend: { orientation: 'h', y: -0.2 } };
            Plotly.react('chart_tech', [ { x: x, y: x.map(k=>map[k].op), name: 'Operando', type: 'bar', marker: { color: '#10B981' } }, { x: x, y: x.map(k=>map[k].off), name: 'Offline', type: 'bar', marker: { color: '#BC1818' } } ], layout, { responsive: true, displayModeBar: false });
            
            const elTech = document.getElementById('chart_tech');
            if (elTech && typeof elTech.removeAllListeners === 'function') { elTech.removeAllListeners('plotly_click'); }
            if (elTech) { elTech.on('plotly_click', d => { currentFilters.tecnologia = (currentFilters.tecnologia === d.points[0].x) ? null : d.points[0].x; updateDashboard(); }); }
        }

        function renderGravityChart(data) {
            const map = { "1 a 3 días": 0, "4 a 7 días": 0, "Más de 7 días": 0, "Sin registro previo": 0 };
            data.filter(d => d.estado !== 'Operando').forEach(d => { if(map[d.gravedad] !== undefined) map[d.gravedad]++; });
            const x = Object.keys(map);
            const layout = { ...getLayoutBase(), title: { text: '<b>Gravedad (Mejor a Peor)</b>', font: {size: 15}, x: 0.5 } };
            Plotly.react('chart_gravity', [{ x: x, y: x.map(k=>map[k]), type: 'bar', marker: { color: ['#F59E0B', '#E84C22', '#BC1818', '#5A5A59'] } }], layout, { responsive: true, displayModeBar: false });
            
            const elGrav = document.getElementById('chart_gravity');
            if (elGrav && typeof elGrav.removeAllListeners === 'function') { elGrav.removeAllListeners('plotly_click'); }
            if (elGrav) { elGrav.on('plotly_click', d => { currentFilters.gravedad = (currentFilters.gravedad === d.points[0].x) ? null : d.points[0].x; updateDashboard(); }); }
        }

        function renderTopDealersChart(data) {
            const map = {}; data.filter(d => d.estado !== 'Operando').forEach(d => map[d.dealer] = (map[d.dealer]||0) + 1);
            const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10).reverse();
            const layout = { ...getLayoutBase(), title: { text: '<b>Top Dealers (Offline)</b>', font: {size: 15}, x: 0.5 }, margin: { t:40, b:30, l:170, r:20 } };
            Plotly.react('chart_top_dealers', [{ y: sorted.map(i=>truncateLabel(i[0], 25)), x: sorted.map(i=>i[1]), type: 'bar', orientation: 'h', marker: { color: '#BC1818' }, text: sorted.map(i=>i[0]), textposition: 'none', hoverinfo: 'text+x' }], layout, { responsive: true, displayModeBar: false });
            
            const elDeal = document.getElementById('chart_top_dealers');
            if (elDeal && typeof elDeal.removeAllListeners === 'function') { elDeal.removeAllListeners('plotly_click'); }
            if (elDeal) { elDeal.on('plotly_click', d => { filterByDropdown('dealer', (currentFilters.dealer === d.points[0].text) ? 'TODOS' : d.points[0].text); }); }
        }

        function renderTopClientsChart(data) {
            const map = {}; data.filter(d => d.estado !== 'Operando').forEach(d => map[d.cliente] = (map[d.cliente]||0) + 1);
            const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10).reverse();
            const layout = { ...getLayoutBase(), title: { text: '<b>Top Clientes (Offline)</b>', font: {size: 15}, x: 0.5 }, margin: { t:40, b:30, l:170, r:20 } };
            Plotly.react('chart_top_clients', [{ y: sorted.map(i=>truncateLabel(i[0], 25)), x: sorted.map(i=>i[1]), type: 'bar', orientation: 'h', marker: { color: '#E84C22' }, text: sorted.map(i=>i[0]), textposition: 'none', hoverinfo: 'text+x' }], layout, { responsive: true, displayModeBar: false });
            
            const elClient = document.getElementById('chart_top_clients');
            if (elClient && typeof elClient.removeAllListeners === 'function') { elClient.removeAllListeners('plotly_click'); }
            if (elClient) { elClient.on('plotly_click', d => { filterByDropdown('cliente', (currentFilters.cliente === d.points[0].text) ? 'TODOS' : d.points[0].text); }); }
        }

        function renderTopModelsChart(data) {
            const map = {}; data.filter(d => d.estado !== 'Operando').forEach(d => map[d.modelo] = (map[d.modelo]||0) + 1);
            const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10).reverse();
            const layout = { ...getLayoutBase(), title: { text: '<b>Top Modelos (Offline)</b>', font: {size: 15}, x: 0.5 }, margin: { t:40, b:30, l:170, r:20 } };
            Plotly.react('chart_top_models', [{ y: sorted.map(i=>truncateLabel(i[0], 25)), x: sorted.map(i=>i[1]), type: 'bar', orientation: 'h', marker: { color: '#F59E0B' }, text: sorted.map(i=>i[0]), textposition: 'none', hoverinfo: 'text+x' }], layout, { responsive: true, displayModeBar: false });
            
            const elModel = document.getElementById('chart_top_models');
            if (elModel && typeof elModel.removeAllListeners === 'function') { elModel.removeAllListeners('plotly_click'); }
            if (elModel) { elModel.on('plotly_click', d => { currentFilters.modelo = (currentFilters.modelo === d.points[0].text) ? null : d.points[0].text; updateDashboard(); }); }
        }

        function changePage(direction) {
            currentPage += direction;
            renderTableOnly();
        }

        function renderTableOnly(dataToRender) {
            const data = dataToRender || getFilteredData();
            const tbody = document.getElementById('table_body');
            const msg = document.getElementById('no_data_message');
            const paginationCtr = document.getElementById('pagination_controls');
            
            let finalData = data.filter(d => d.generador.toLowerCase().includes(searchTerm));
            finalData.sort((a, b) => b.dias_offline - a.dias_offline);
            
            if(finalData.length === 0) { 
                tbody.innerHTML = ''; 
                msg.style.display = 'block'; 
                paginationCtr.style.display = 'none';
                return; 
            }
            msg.style.display = 'none';
            paginationCtr.style.display = 'flex';

            const totalPages = Math.ceil(finalData.length / rowsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const paginatedData = finalData.slice(startIndex, endIndex);

            let tableHTML = '';
            paginatedData.forEach(r => {
                const statusBadge = r.estado === 'Operando' ? '<span class="badge-ok">Operando</span>' : '<span class="badge-p1">Offline</span>';
                let gravBadge = '<span class="badge-ok">Estable</span>';
                let diasStr = r.dias_offline === 0 ? '-' : r.dias_offline + ' días';
                
                if(r.estado !== 'Operando') {
                    if(r.gravedad === '1 a 3 días') gravBadge = '<span class="badge-p2">1 a 3 días</span>';
                    else if(r.gravedad === '4 a 7 días') gravBadge = '<span class="badge-p2" style="color:#E84C22; background:rgba(232,76,34,0.12)">4 a 7 días</span>';
                    else if(r.gravedad === 'Más de 7 días') gravBadge = '<span class="badge-p1">Más de 7 días</span>';
                    else gravBadge = `<span class="badge-mid">${r.gravedad}</span>`;
                }
                tableHTML += `<tr>
                    <td class="text-sub">${r.dealer}</td>
                    <td class="font-bold">${r.generador}</td>
                    <td class="text-sub">${r.cliente}</td>
                    <td class="text-sub">${r.modelo}</td>
                    <td class="font-bold">${r.horometro_visual}</td>
                    <td>${statusBadge}</td>
                    <td class="text-sub">${r.fecha}</td>
                    <td class="font-bold" style="text-align:center;">${diasStr}</td>
                    <td>${gravBadge}</td>
                    <td><strong style="font-size:12px;">${r.plan_accion}</strong></td>
                </tr>`;
            });
            tbody.innerHTML = tableHTML;

            document.getElementById('pagination_info').innerText = `Mostrando ${startIndex + 1} a ${Math.min(endIndex, finalData.length)} de ${finalData.length} registros`;
            
            const btnPrev = document.getElementById('btn_prev');
            const btnNext = document.getElementById('btn_next');
            
            btnPrev.disabled = currentPage === 1;
            btnNext.disabled = currentPage === totalPages;
            btnPrev.style.opacity = currentPage === 1 ? '0.5' : '1';
            btnPrev.style.cursor = currentPage === 1 ? 'not-allowed' : 'pointer';
            btnNext.style.opacity = currentPage === totalPages ? '0.5' : '1';
            btnNext.style.cursor = currentPage === totalPages ? 'not-allowed' : 'pointer';
        }
        
        function exportToCSV() {
            const dataToExport = getFilteredData().filter(d => d.generador.toLowerCase().includes(searchTerm));
            if (dataToExport.length === 0) return alert("No hay datos para exportar.");
            const headers = ["Dealer", "Generador", "Cliente", "Tecnologia", "Modelo_Script", "Horometro", "Estado", "Ultima_Conexion", "Severidad", "Dias_Desconectado", "Latitud", "Longitud", "Plan_de_Accion"];
            const csvRows = [headers.join(',')];
            dataToExport.forEach(r => {
                const latStr = r.lat !== null ? r.lat : ''; const lonStr = r.lon !== null ? r.lon : '';
                const values = [ `"${r.dealer}"`, `"${r.generador}"`, `"${r.cliente}"`, `"${r.tecnologia}"`, `"${r.modelo}"`, `"${r.horometro_visual}"`, `"${r.estado}"`, `"${r.fecha}"`, `"${r.gravedad}"`, r.dias_offline, latStr, lonStr, `"${r.plan_accion}"` ];
                csvRows.push(values.join(','));
            });
            const blob = new Blob(["\uFEFF" + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.setAttribute('href', url); a.setAttribute('download', `Artimo_Equipos_${new Date().getTime()}.csv`); document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function exportToPDF() {
            const element = document.getElementById('report_area');
            const opt = { margin: 0.3, filename: `Reporte_Artimo_${new Date().getTime()}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } };
            html2pdf().set(opt).from(element).save();
        }
    </script>
